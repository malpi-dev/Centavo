name: centavo
description: "Offline-first personal finance app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: any
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  meta: ^1.18.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - {asset: assets/fonts/Manrope-500.ttf, weight: 500}
        - {asset: assets/fonts/Manrope-600.ttf, weight: 600}
        - {asset: assets/fonts/Manrope-700.ttf, weight: 700}
        - {asset: assets/fonts/Manrope-800.ttf, weight: 800}
    - family: Inter
      fonts:
        - {asset: assets/fonts/Inter-400.ttf, weight: 400}
        - {asset: assets/fonts/Inter-500.ttf, weight: 500}
        - {asset: assets/fonts/Inter-600.ttf, weight: 600}
